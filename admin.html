<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Vanguard Labs Admin</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

  <!-- BACKGROUND GLOWS -->
  <div class="background-glow glow-1"></div>
  <div class="background-glow glow-2"></div>

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="logo">
      VANGUARD LABS
    </div>

    <div class="nav-links">
      <a href="index.html">Store</a>
      <a href="#">Orders</a>
    </div>

  </nav>

  <!-- LOGIN -->
  <div class="admin-login">

    <h1>Admin Dashboard</h1>

    <p style="color:#9f9f9f; margin-bottom:25px; text-align:center;">
      Secure order management portal
    </p>

    <input
      type="password"
      id="adminPassword"
      placeholder="Enter admin password"
    >

    <button onclick="loginAdmin()">
      Access Dashboard
    </button>

  </div>

  <!-- ADMIN PANEL -->
  <div
    class="admin-panel"
    id="adminPanel"
    style="display:none;"
  >

    <!-- TITLE -->
    <div class="section-title">

      <h2>Orders Dashboard</h2>

      <p>
        Review customer orders and payment information
      </p>

    </div>

    <!-- ORDERS -->
    <div id="orders"></div>

  </div>

  <script src="script.js"></script>

</body>
</html>
